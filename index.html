<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多幣別匯率計算機</title>
<meta name="description" content="輸入一個幣別的金額,同時換算成多個幣別。">
<script>
(function(){
  var t=null; try{t=localStorage.getItem("theme")}catch(e){}
  if(t!=="light"&&t!=="dark") t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 夏日:淺色是海風、蜜桃、薄荷;深色是微涼的夏夜海面 */
:root{
  --bg1:#d9f2ff; --bg2:#fff1dc; --bg3:#ffe0e6; --panel:#ffffffcc; --ink:#23405a; --muted:#6f8aa0;
  --accent:#ff7a6b; --accent2:#ffb347; --accent-ink:#ffffff; --num:#0f9aa8; --line:#cfe6f2; --field:#f3fbff;
  --mint:#bff0dc; --err:#d6453a; --shadow:rgba(60,140,190,.22);
  --rune:"Fredoka","Noto Sans TC",sans-serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:var(--sans);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg1:#10294a; --bg2:#2a2a55; --bg3:#3b2a52; --panel:#16335acc; --ink:#e8f4ff; --muted:#9db8d2;
  --accent:#ff8b7b; --accent2:#ffc062; --accent-ink:#2a1a1a; --num:#7be3d6; --line:#2d5078; --field:#0f2744;
  --mint:#2f6b66; --err:#ff9a8d; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font:16px/1.6 var(--sans);min-height:100vh;
  background:
    radial-gradient(circle at 12% 8%,var(--bg3) 0,transparent 38%),
    radial-gradient(circle at 92% 20%,var(--bg2) 0,transparent 42%),
    linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;
}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding:8px 0 20px}
h1{margin:0;font:900 clamp(1.6rem,4vw,2.3rem)/1.2 var(--sans);letter-spacing:.03em}
h1::before{content:"";display:inline-block;width:.7em;height:.7em;margin-right:.35em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c9,var(--accent2));box-shadow:0 0 0 .18em color-mix(in srgb,var(--accent2) 35%,transparent)}
.stamp{color:var(--muted);font-size:.9rem}
.grid{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:860px){.grid{grid-template-columns:minmax(340px,5fr) 6fr;align-items:start}.side{position:sticky;top:16px}}
.card{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid #fff8;border-radius:24px;box-shadow:0 14px 34px var(--shadow)}
:root[data-theme=dark] .card{border-color:#ffffff1a}
.side{padding:24px}
label,.lbl{display:block;font-size:.9rem;font-weight:500;color:var(--muted);margin-bottom:6px}
input,select,button{font:inherit;color:inherit}
input[type=number],select{width:100%;min-height:50px;padding:8px 14px;border:2px solid var(--line);border-radius:16px;background:var(--field)}
input[type=number]{font:600 1.6rem var(--rune);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus{border-color:var(--accent2)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.field+.field{margin-top:16px}
.toggle{width:100%;min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border:2px solid var(--line);border-radius:16px;background:var(--field);cursor:pointer;text-align:left}
.toggle .sum{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle .cnt{color:var(--accent);font-weight:700}
.toggle::after{content:"";width:9px;height:9px;flex:none;border:solid var(--accent);border-width:0 3px 3px 0;border-radius:2px;transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.toggle[aria-expanded=true]::after{transform:rotate(-135deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips[hidden]{display:none}
.chips label{margin:0;position:relative}
.chips input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chips span{display:block;padding:8px 14px;min-height:40px;border:2px solid var(--line);border-radius:999px;background:var(--field);font-size:.95rem;font-weight:500}
.chips input:checked+span{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);font-weight:700;box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.chips input:focus-visible+span{outline:3px solid var(--accent2);outline-offset:2px}
.out h2{margin:0;padding:18px 22px;font:700 1.15rem var(--sans)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 14px 10px;padding:14px 16px;border-radius:18px;background:var(--field)}
.row:last-child{margin-bottom:14px}
.row:nth-child(3n+1){background:color-mix(in srgb,var(--mint) 55%,var(--field))}
.row .c{font-weight:700}
.row .v{text-align:right;font:600 clamp(1.3rem,4.5vw,1.8rem)/1.2 var(--rune);font-variant-numeric:tabular-nums;word-break:break-all;color:var(--num)}
.empty{padding:20px 22px;color:var(--muted)}
.empty.err{color:var(--err)}
footer{margin-top:22px;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
footer a{color:inherit}
.theme{display:inline-flex;padding:3px;border-radius:999px;background:var(--field);border:2px solid var(--line)}
.theme button{min-height:34px;padding:2px 16px;border:0;border-radius:999px;background:transparent;cursor:pointer;color:var(--muted);font-weight:500}
.theme button[aria-pressed=true]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>多幣別匯率計算機</h1>
    <div class="stamp" id="stamp">讀取匯率中…</div>
  </header>

  <div class="grid">
    <section class="card side" aria-label="輸入">
      <div class="field">
        <label for="from">幣別 A</label>
        <select id="from"></select>
      </div>
      <div class="field">
        <label for="amt">金額</label>
        <input id="amt" type="number" inputmode="decimal" min="0" step="any" value="1000">
      </div>
      <div class="field">
        <div class="lbl" id="tl">換算成(可多選)</div>
        <button type="button" class="toggle" id="toggle" aria-expanded="false" aria-controls="chips" aria-labelledby="tl tsum">
          <span class="sum" id="tsum"></span>
        </button>
        <div class="chips" id="chips" role="group" aria-labelledby="tl" hidden></div>
      </div>
    </section>

    <section class="card out" aria-label="換算結果" aria-live="polite">
      <h2 id="outTitle">換算結果</h2>
      <div id="list"></div>
    </section>
  </div>

  <footer>
    <div>
      <div id="foot-update">上次更新:—</div>
      <div id="foot-src">資料來源:<a href="https://rate.bot.com.tw/xrt" target="_blank" rel="noopener">臺灣銀行牌告匯率</a>(現金匯率)。<a id="foot-pub" href="https://app.haotool.org/ratewise/" target="_blank" rel="noopener">資料整理:匯率好工具 RateWise</a>。匯率僅供參考,不保證可依此匯率成交,未含手續費。</div>
    </div>
    <span>作者:Paman</span>
    <div class="theme" role="group" aria-label="佈景主題">
      <button type="button" data-theme="light" aria-pressed="false">淺色</button>
      <button type="button" data-theme="dark" aria-pressed="false">深色</button>
    </div>
  </footer>
</div>

<script>
const NAMES = {TWD:"新臺幣",USD:"美金",HKD:"港幣",GBP:"英鎊",AUD:"澳幣",CAD:"加拿大幣",SGD:"新加坡幣",CHF:"瑞士法郎",JPY:"日圓",ZAR:"南非幣",SEK:"瑞典幣",NZD:"紐西蘭幣",THB:"泰幣",PHP:"菲律賓比索",IDR:"印尼盾",EUR:"歐元",KRW:"韓元",VND:"越南盾",MYR:"馬來幣",CNY:"人民幣"};
const $ = id => document.getElementById(id);
const S = {rates:{}, from:"TWD", picked:new Set(["USD","JPY","CNY"])};
const nf = (n, d) => n.toLocaleString("zh-TW", {minimumFractionDigits:d, maximumFractionDigits:d});
const digits = c => ["JPY","KRW","VND","IDR"].includes(c) ? 0 : 2;
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// 只用現金匯率:A 換成新臺幣用「買入」,新臺幣換成目標幣別用「賣出」
const buy  = c => c === "TWD" ? 1 : S.rates[c].cashBuy;
const sell = c => c === "TWD" ? 1 : S.rates[c].cashSell;
const targets = () => [...S.picked].filter(c => c !== S.from && (c === "TWD" || S.rates[c]));

function renderResults(){
  const amt = parseFloat($("amt").value), list = targets();
  $("outTitle").textContent = `${NAMES[S.from]}(${S.from}) → ${list.length} 種幣別`;
  $("tsum").innerHTML = `<span class="cnt">已選 ${list.length} 種</span> ${list.map(c => NAMES[c]).join("、")}`;
  if (!list.length) { $("list").innerHTML = '<div class="empty">請展開「換算成」,至少選一種幣別。</div>'; return; }
  if (!(amt >= 0)) { $("list").innerHTML = '<div class="empty">請輸入金額。</div>'; return; }
  $("list").innerHTML = list.map(c => {
    const unit = buy(S.from) / sell(c);
    return `<div class="row"><div class="c">${NAMES[c]}(${c})</div><div class="v">${nf(amt * unit, digits(c))}</div></div>`;
  }).join("");
}

function renderChips(){
  const order = ["TWD", ...Object.keys(S.rates)].filter(c => c !== S.from);
  $("chips").innerHTML = order.map(c =>
    `<label><input type="checkbox" value="${c}" ${S.picked.has(c)?"checked":""}><span>${NAMES[c]||""} ${c}</span></label>`).join("");
}

function save(){ store.set("fx", {from:S.from, picked:[...S.picked], amt:$("amt").value}); }

function setTheme(t){
  document.documentElement.dataset.theme = t;
  document.querySelectorAll(".theme button").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === t));
  try { localStorage.setItem("theme", t); } catch {}
}
document.querySelectorAll(".theme button").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.theme)));
setTheme(document.documentElement.dataset.theme);

$("toggle").addEventListener("click", () => {
  const open = $("toggle").getAttribute("aria-expanded") === "true";
  $("toggle").setAttribute("aria-expanded", !open);
  $("chips").hidden = open;
});

async function init(){
  try {
    const res = await fetch("rates.json", {cache:"no-cache"});
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    // 只保留有現金買入與賣出價的幣別
    for (const [c, r] of Object.entries(d.rates || {})) if (r.cashBuy && r.cashSell) S.rates[c] = r;
    if (!Object.keys(S.rates).length) throw new Error("empty");
    const t = d.updatedAt ? new Date(d.updatedAt) : null;
    const when = t ? t.toLocaleString("zh-TW", {timeZone:"Asia/Taipei", hour12:false, dateStyle:"medium", timeStyle:"short"}) + "(臺北時間)" : "";
    $("stamp").textContent = t ? "更新於 " + when : "";
    $("foot-update").textContent = "上次更新:" + (when || "—");
  } catch (e) {
    $("stamp").textContent = "無法取得匯率";
    $("list").innerHTML = '<div class="empty err">目前沒有匯率資料。請到 GitHub 的 Actions 頁面手動執行「Update rates」,再重新整理本頁。</div>';
    return;
  }
  const all = ["TWD", ...Object.keys(S.rates)];
  const saved = store.get("fx");
  if (saved) {
    if (all.includes(saved.from)) S.from = saved.from;
    S.picked = new Set(saved.picked.filter(c => all.includes(c)));
    if (saved.amt) $("amt").value = saved.amt;
  } else {
    S.picked = new Set([...S.picked].filter(c => all.includes(c)));
  }
  $("from").innerHTML = all.map(c => `<option value="${c}">${NAMES[c]||""} ${c}</option>`).join("");
  $("from").value = S.from;
  renderChips(); renderResults();

  $("amt").addEventListener("input", () => { renderResults(); save(); });
  $("from").addEventListener("change", e => { S.from = e.target.value; renderChips(); renderResults(); save(); });
  $("chips").addEventListener("change", e => {
    e.target.checked ? S.picked.add(e.target.value) : S.picked.delete(e.target.value);
    renderResults(); save();
  });
}
init();
</script>
</body>
</html>
