name: Update rates

on:
  schedule:
    # 每小時一次
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch rates (HaoRate open data API)
        run: node scripts/fetch-rates.js
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain rates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rates.json
            git commit -m "chore: update rates"
            git push
          fi
